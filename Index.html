<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d4f">
<script>try{var t=localStorage.getItem('stave-chord-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Stave Chord Lyric Sheet</title>
<style>
:root{
  --bg:#f3f8f3; --panel:#fbfdfb; --ink:#18271e; --muted:#62786a; --line:#cddccf;
  --accent:#2e7d4f; --accent-soft:#d9eddf; --hover:#e6f1e8; --on-accent:#ffffff; --hh:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111a14; --panel:#17231b; --ink:#e2eee6; --muted:#93a99b; --line:#2a3b30;
         --accent:#6fcf97; --accent-soft:#1d3a29; --hover:#203227; --on-accent:#0c1f13; }
}
:root[data-theme="dark"]{ --bg:#111a14; --panel:#17231b; --ink:#e2eee6; --muted:#93a99b; --line:#2a3b30;
         --accent:#6fcf97; --accent-soft:#1d3a29; --hover:#203227; --on-accent:#0c1f13; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-block}
button:hover,.btn:hover{background:var(--hover)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.link{border:0;background:none;color:var(--accent);padding:0 2px;text-decoration:underline}
input[type=text],input:not([type]){font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 9px;border-radius:7px;min-width:0}

.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 14px}
.titleIn{font-size:17px;font-weight:600;width:240px;max-width:100%}
.grow{flex:1}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg button:last-child{border-radius:0 7px 7px 0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
#lyr{width:100%;min-height:62vh;font:17px/1.55 Georgia,serif;padding:14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}

.layout{display:flex;align-items:flex-start}
#palette{flex:0 0 330px;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow:auto;
  background:var(--panel);border-right:1px solid var(--line);padding:10px}
#palette.trash{outline:3px dashed #c0392b;outline-offset:-4px}
#ptabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:3px 10px;font-size:13px;border-radius:999px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#pstatus{font-size:12.5px;color:var(--muted);margin:2px 0 12px;min-height:34px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plabel{font-weight:600;font-size:13px;margin:14px 0 6px}
.pitem{position:relative;border:1px solid var(--line);border-radius:8px;padding:4px 2px 6px;text-align:center;
  cursor:grab;touch-action:none;background:var(--bg);user-select:none;-webkit-user-select:none}
.pitem:hover{background:var(--hover)}
.pitem.armed{outline:2px solid var(--accent);background:var(--accent-soft)}
.pitem .lbl{font-weight:600;font-size:13px;margin-top:1px}
.pitem .x{position:absolute;top:1px;right:1px;padding:0 6px;line-height:18px;border-radius:5px;font-size:14px}
svg.stave{display:block;margin:0 auto;color:var(--ink);overflow:visible}

.editor{display:flex;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:6px;cursor:crosshair;margin:8px 0;user-select:none;-webkit-user-select:none}
.seg.small button{padding:4px 8px;font-size:13px}
#palette .row input{flex:1;width:100px}

#sheetWrap{flex:1;min-width:0;padding:16px 28px 140px 60px}
.sheetbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:6px}
.sheetbar label{display:inline-flex;align-items:center;gap:6px}
.sheetbar input[type=range]{width:110px}
#songTitle{margin:10px 0 18px;font-size:26px}
#sheet{user-select:none;-webkit-user-select:none}
.line{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.55em;margin-bottom:.5em}
.line.blank{min-height:1.9em;align-items:center}
.unit{display:flex;flex-direction:column;align-items:flex-start;min-width:calc(30px*var(--z,1));padding:0 2px;border-radius:6px}
.unit.over{background:var(--accent-soft);outline:2px dashed var(--accent)}
body.armed .unit{cursor:copy}
.slot{display:flex;flex-direction:column;justify-content:flex-end}
.placed{position:relative;cursor:grab;touch-action:none}
.placed.lifted{opacity:.3}
.placed .x{position:absolute;top:0;right:-4px;opacity:0;padding:0 6px;line-height:18px;font-size:14px;border-radius:5px}
.placed:hover .x{opacity:1}
.cname{height:calc(14px*var(--z,1));line-height:calc(14px*var(--z,1));font-size:calc(11px*var(--z,1));font-weight:700;color:var(--accent);white-space:nowrap}
.hidenames .cname{display:none}
.word{white-space:pre;line-height:1.3}
.unit.tail .slot{width:calc(34px*var(--z,1));border:1.5px dashed var(--line);border-radius:7px;opacity:.3;
  align-items:center;justify-content:center;color:var(--muted)}
.unit.tail .plus{font-size:calc(16px*var(--z,1));line-height:1}
.line:hover .unit.tail .slot,body.dragging .unit.tail .slot,body.armed .unit.tail .slot{opacity:.9}
.unit.tail.over .slot{border-color:var(--accent)}
.line.blank .unit.tail{min-width:0}
.line.blank .unit.tail .slot{width:calc(52px*var(--z,1));opacity:.45}
.gut{position:absolute;right:100%;margin-right:8px;bottom:0;display:flex;gap:2px}
.gbtn{padding:0 6px;line-height:18px;font-size:14px;border-radius:5px;opacity:0}
.line:hover .gbtn{opacity:.85}
@media (hover:none){.gbtn{opacity:.55}}
#empty{color:var(--muted)}

.ghost{position:fixed;z-index:1000;pointer-events:none;background:var(--panel);border:1px solid var(--accent);
  border-radius:8px;padding:3px 6px;box-shadow:0 6px 18px rgba(0,0,0,.28);transform:translate(-50%,-60%);color:var(--ink)}
.ghost .gl{font-weight:700;font-size:12px;color:var(--accent);text-align:center}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

#printTitle{display:none}
@media (max-width:820px){
  .layout{flex-direction:column}
  #palette{flex:none;width:100%;height:auto;max-height:44vh;z-index:20;border-right:0;border-bottom:1px solid var(--line)}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  #sheetWrap{padding:12px 14px 120px 56px}
}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{--bg:#fff;--panel:#fff;--ink:#000;--muted:#555;--line:#ccc;--accent:#000;--on-accent:#fff}
  .top,#palette,.sheetbar,#vL{display:none!important}
  .layout{display:block}
  #sheetWrap{padding:0}
  .placed .x,.gut,.unit.tail{display:none!important}
  .line{break-inside:avoid}
  .cname{color:#000}
}
</style>
</head>
<body>

<header class="top">
  <input id="title" class="titleIn" type="text" placeholder="Song title" aria-label="Song title">
  <div class="seg" role="tablist">
    <button id="tabL" class="on">Lyrics</button><button id="tabC">Chords</button>
  </div>
  <span class="grow"></span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button id="save" title="Download the sheet as a file">Save file</button>
  <label class="btn" title="Open a saved sheet or a .txt of lyrics">Open file<input id="open" type="file" accept=".json,.txt,application/json,text/plain" hidden></label>
  <button id="print">Print</button>
  <button id="theme" title="Switch between light and dark theme"></button>
</header>

<section id="vL">
  <div class="wrap">
    <p class="hint">Paste or type your lyrics. Each line of text becomes a line on the sheet; blank lines are kept. When you're done, go to <b>Chords</b>. You can come back and edit the lyrics later &mdash; chords stay attached to the words that didn't change.</p>
    <textarea id="lyr" spellcheck="false" placeholder="Paste lyrics here…"></textarea>
    <div class="row"><button id="toChords" class="primary">Add chords →</button></div>
  </div>
</section>

<section id="vC" hidden>
  <div class="layout">
    <aside id="palette" aria-label="Chord palette">
      <div id="ptabs"></div>
      <div id="pstatus"></div>
      <div id="pbody"></div>
    </aside>
    <div id="sheetWrap">
      <div class="sheetbar">
        <label>Stave size <input id="zoom" type="range" min="0.8" max="2.4" step="0.1"></label>
        <label>Text size <input id="fsize" type="range" min="14" max="40" step="1"></label>
        <label><input id="names" type="checkbox"> Chord names</label>
      </div>
      <h2 id="songTitle"></h2>
      <div id="sheet"></div>
      <p id="empty" hidden>There are no lyrics yet. Go to the <b>Lyrics</b> tab to paste or type some.</p>
    </div>
  </div>
</section>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- music model ---------- */
const LETTERS='CDEFGAB', NAT_PC=[0,2,4,5,7,9,11];
const NOTE_RE=/^([A-G])(##|bb|#|b)?(\d)$/;
const ACC={'':0,'#':1,'b':-1,'##':2,'bb':-2};
const ACC_S={0:'',1:'#','-1':'b',2:'##','-2':'bb'};
const BASE_MIN=28, BASE_MAX=40;          // C4 .. A5 : staff plus one ledger line each side
const STAFF=[30,32,34,36,38];            // E4 G4 B4 D5 F5
const RX=5.3, RY=3.7, HALF=4, PAD=6;
const parseNote=s=>{const m=NOTE_RE.exec(s);return m?{idx:+m[3]*7+LETTERS.indexOf(m[1]),acc:ACC[m[2]||'']}:null;};
const noteStr=(idx,acc)=>LETTERS[idx%7]+ACC_S[acc]+Math.floor(idx/7);

const MAJ_ROOTS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN_ROOTS=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const DIM_ROOTS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const QUALS=[
  {id:'major',label:'Major',suffix:'',   iv:[[0,0],[2,4],[4,7]],        roots:MAJ_ROOTS},
  {id:'minor',label:'Minor',suffix:'m',  iv:[[0,0],[2,3],[4,7]],        roots:MIN_ROOTS},
  {id:'dom7', label:'7th',  suffix:'7',  iv:[[0,0],[2,4],[4,7],[6,10]], roots:MAJ_ROOTS},
  {id:'maj7', label:'maj7', suffix:'maj7',iv:[[0,0],[2,4],[4,7],[6,11]],roots:MAJ_ROOTS},
  {id:'min7', label:'m7',   suffix:'m7', iv:[[0,0],[2,3],[4,7],[6,10]], roots:MIN_ROOTS},
  {id:'sus2', label:'sus2', suffix:'sus2',iv:[[0,0],[1,2],[4,7]],       roots:MAJ_ROOTS},
  {id:'sus4', label:'sus4', suffix:'sus4',iv:[[0,0],[3,5],[4,7]],       roots:MAJ_ROOTS},
  {id:'dim',  label:'dim',  suffix:'dim',iv:[[0,0],[2,3],[4,6]],        roots:DIM_ROOTS},
];
const ALIAS={'':'major','maj':'major','M':'major','m':'minor','min':'minor','-':'minor','7':'dom7',
  'maj7':'maj7','M7':'maj7','m7':'min7','min7':'min7','-7':'min7','sus2':'sus2','sus4':'sus4','sus':'sus4','dim':'dim'};
const COMMON=['C','G','Am','F','Dm','Em','D','A','E','Bm','G7','C7'];

function buildChord(root,q){
  const L=LETTERS.indexOf(root[0]);
  const ra=root[1]==='#'?1:root[1]==='b'?-1:0;
  const rootPC=NAT_PC[L]+ra, base=28+L;              // root always starts in octave 4
  const notes=q.iv.map(([st,sm])=>{
    const idx=base+st, l=idx%7;
    let d=(((rootPC+sm-NAT_PC[l])%12)+12)%12; if(d>6)d-=12;
    return noteStr(idx,d);
  });
  return {name:root+q.suffix,notes};
}
function parseChordName(str){
  const m=/^\s*([A-Ga-g])([#b♯♭]?)(\S*)\s*$/.exec(str||''); if(!m)return null;
  const acc=m[2]==='♯'?'#':m[2]==='♭'?'b':m[2];
  const id=ALIAS[m[3]]; if(!id)return null;
  const c=buildChord(m[1].toUpperCase()+acc,QUALS.find(q=>q.id===id));
  c.name=m[1].toUpperCase()+acc+m[3];
  return c;
}
const key=c=>c.notes.join(',');
const cloneChord=c=>({name:c.name||'',notes:[...c.notes]});
function sanitizeChord(c){
  if(!c||!Array.isArray(c.notes))return null;
  const notes=c.notes.filter(s=>{const n=typeof s==='string'?parseNote(s):null;return n&&n.idx>=21&&n.idx<=49;}).slice(0,8);
  return notes.length?{name:typeof c.name==='string'?c.name.slice(0,12):'',notes}:null;
}

/* ---------- stave drawing (SVG) ---------- */
function glyph(acc,x,y){
  const sharp='<path d="M-1.7 -8V10M1.7 -10V8" stroke-width="0.9"/><path d="M-3.8 -1.2L3.8 -3.6M-3.8 4.2L3.8 1.8" stroke-width="1.9"/>';
  const flat='<path d="M-2 -11V4" stroke-width="0.9"/><path d="M-2 4C0.5 3 5 1.5 5 -1.8C5 -4.8 1 -4.6 -2 -1.2" stroke-width="1.1"/>';
  let g;
  if(acc===1)g=sharp;
  else if(acc===-1)g=`<g transform="translate(-1.5 0)">${flat}</g>`;
  else if(acc===2)g='<path d="M-3 -3L3 3M-3 3L3 -3" stroke-width="1.8"/>';
  else g=`<g transform="translate(-4.5 0)">${flat}</g><g transform="translate(1.5 0)">${flat}</g>`;
  return `<g transform="translate(${x} ${y})" stroke-linecap="round">${g}</g>`;
}
function renderStave(noteStrs,o={}){
  let min=Math.min(o.min??BASE_MIN,BASE_MIN), max=Math.max(o.max??BASE_MAX,BASE_MAX);
  const zoom=o.zoom??1, minW=o.minW??34;
  const ns=noteStrs.map(parseNote).filter(Boolean).sort((a,b)=>a.idx-b.idx);
  ns.forEach(n=>{min=Math.min(min,n.idx);max=Math.max(max,n.idx);});
  if(o.ghost!=null){min=Math.min(min,o.ghost);max=Math.max(max,o.ghost);}
  for(let i=1;i<ns.length;i++) if(ns[i].idx-ns[i-1].idx===1&&!ns[i-1].disp) ns[i].disp=true;   // seconds sit side by side
  const anyDisp=ns.some(n=>n.disp);
  const cols=[];
  [...ns].reverse().forEach(n=>{                      // stagger accidentals into columns, top to bottom
    if(!n.acc)return;
    let c=cols.findIndex(last=>last-n.idx>=6);
    if(c<0){c=cols.length;cols.push(n.idx);} else cols[c]=n.idx;
    n.col=c;
  });
  const accW=ns.some(n=>n.acc===-2)?14:9, nc=cols.length, padL=4, padR=5;
  const headX0=padL+nc*accW+(nc?1:0);
  const hw=anyDisp?4*RX-1:2*RX;
  const natW=headX0+hw+padR, W=Math.max(natW,minW), off=(W-natW)/2;
  const H=(max-min)*HALF+2*PAD;
  const y=i=>(max-i)*HALF+PAD;
  const cxOf=n=>off+headX0+RX+(n.disp?2*RX-1:0);

  const led=new Map();
  const ledFor=(idx,cx)=>{
    const xl=cx-RX-3.5,xr=cx+RX+3.5;
    const add=l=>{const e=led.get(l); if(e){e[0]=Math.min(e[0],xl);e[1]=Math.max(e[1],xr);} else led.set(l,[xl,xr]);};
    if(idx<30) for(let l=28;l>=idx;l-=2)add(l);
    else if(idx>38) for(let l=40;l<=idx;l+=2)add(l);
  };
  ns.forEach(n=>ledFor(n.idx,cxOf(n)));
  if(o.ghost!=null) ledFor(o.ghost,off+headX0+RX);

  let s=`<svg class="stave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${(W*zoom).toFixed(1)}" height="${(H*zoom).toFixed(1)}" fill="none" stroke="currentColor" aria-hidden="true">`;
  s+='<g stroke-width="0.7" opacity="0.85">'+STAFF.map(i=>`<path d="M0 ${y(i)}H${W}"/>`).join('')+'</g>';
  s+='<g stroke-width="0.9">'+[...led].map(([l,[a,b]])=>`<path d="M${a} ${y(l)}H${b}"/>`).join('')+'</g>';
  ns.forEach(n=>{
    if(n.acc) s+=glyph(n.acc,off+padL+(nc-1-n.col)*accW+accW/2,y(n.idx));
    const cx=cxOf(n),cy=y(n.idx);
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="${RX}" ry="${RY}" transform="rotate(-20 ${cx} ${cy})" fill="currentColor" stroke="none"/>`;
  });
  if(o.ghost!=null){
    const cx=off+headX0+RX,cy=y(o.ghost);
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="${RX}" ry="${RY}" transform="rotate(-20 ${cx} ${cy})" fill="currentColor" stroke="none" opacity="0.35"/>`;
  }
  return s+'</svg>';
}
const staveH=(min,max)=>(Math.max(max,BASE_MAX)-Math.min(min,BASE_MIN))*HALF+2*PAD;

/* ---------- document state ---------- */
const KEY='stave-chord-sheet.v1';
const state={title:'',lines:[],mine:[],zoom:1.3,fontSize:20,names:true};
let past=[],future=[],view='L',tab='common',armed=null;

const snap=()=>JSON.stringify({lines:state.lines,mine:state.mine});
function restore(s){const d=JSON.parse(s);state.lines=d.lines;state.mine=d.mine;}
function syncUndo(){$('#undo').disabled=!past.length;$('#redo').disabled=!future.length;}
function commit(){past.push(snap());if(past.length>150)past.shift();future=[];syncUndo();}
let pt;
function persist(){clearTimeout(pt);pt=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(toData()));}catch(e){}},200);}
function mutate(fn){commit();fn();persist();renderSheet();}
function afterChange(){persist();syncUndo();refreshAll();}
function undo(){applyLyrics();if(!past.length)return;future.push(snap());restore(past.pop());afterChange();}
function redo(){if(!future.length)return;past.push(snap());restore(future.pop());afterChange();}

const serializeLines=ls=>ls.map(l=>l.filter(w=>w.t).map(w=>w.t).join(' ')).join('\n');
const serializeText=()=>serializeLines(state.lines);
function parseLyrics(t){
  t=t.replace(/\r\n?/g,'\n').replace(/\s+$/,'');
  if(!t.trim())return [];
  return t.split('\n').map(l=>{const s=l.trim();return s?s.split(/\s+/).map(w=>({t:w,c:null})):[];});
}
function flat(lines){const t=[],c=[];lines.forEach(l=>{l.forEach(w=>{t.push(w.t);c.push(w.c);});t.push('\n');c.push(null);});return {t,c};}
function lcsMap(a,b){                         // map[j] = index in a matched to b[j], or -1
  const n=a.length,m=b.length,map=new Array(m).fill(-1);
  if(n*m>8e6){for(let j=0;j<m&&j<n;j++)if(a[j]===b[j])map[j]=j;return map;}
  const W=m+1,dp=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){map[j]=i;i++;j++;}
    else if(dp[(i+1)*W+j]>=dp[i*W+j+1])i++; else j++;
  }
  return map;
}
function carry(oldLines,newLines){            // keep chords on surviving words (LCS diff) and chord-only tails
  const real=oldLines.map(l=>l.filter(w=>w.t)), tails=oldLines.map(l=>l.filter(w=>!w.t&&w.c));
  const a=flat(real),b=flat(newLines),newTail=newLines.map(()=>[]);
  const map=lcsMap(a.t,b.t);
  let k=0;
  newLines.forEach(l=>{l.forEach(w=>{const o=map[k];if(o>=0&&a.c[o])w.c=a.c[o];k++;});k++;});
  const o2n=new Array(a.t.length).fill(-1); map.forEach((o,j)=>{if(o>=0)o2n[o]=j;});
  const lineOfNew=[]; newLines.forEach((l,i)=>{l.forEach(()=>lineOfNew.push(i));lineOfNew.push(i);});
  let p=0; const nlIdx=[]; real.forEach(l=>{p+=l.length;nlIdx.push(p);p++;});
  tails.forEach((t,i)=>{                      // a line's tail follows that line's end-of-line marker
    if(!t.length)return;
    const j=o2n[nlIdx[i]];
    const li=j>=0?lineOfNew[j]:(i<newLines.length?i:-1);
    if(li>=0)newTail[li].push(...t);
  });
  newLines.forEach((l,i)=>l.push(...newTail[i]));
  return newLines;
}
function applyLyrics(){
  if(view!=='L')return;
  const nl=parseLyrics($('#lyr').value);
  if(serializeLines(nl)===serializeText())return;
  commit(); state.lines=carry(state.lines,nl); persist();
}

/* ---------- save / open ---------- */
function toData(){
  return {format:'stave-chord-sheet',version:1,title:state.title,
    lines:state.lines.map(l=>l.map(w=>w.c?{t:w.t,c:w.c}:{t:w.t})),
    mine:state.mine,zoom:state.zoom,fontSize:state.fontSize,names:state.names};
}
function loadData(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.lines))return false;
  state.lines=d.lines.slice(0,5000).map(l=>Array.isArray(l)?l.slice(0,300).map(w=>
    (w&&typeof w.t==='string')?{t:w.t.replace(/\s+/g,'').slice(0,100),c:sanitizeChord(w.c)}:null).filter(w=>w&&(w.t||w.c)):[])
    .map(l=>[...l.filter(w=>w.t),...l.filter(w=>!w.t)]);
  state.mine=(Array.isArray(d.mine)?d.mine:[]).map(sanitizeChord).filter(Boolean).slice(0,200);
  state.title=typeof d.title==='string'?d.title.slice(0,200):'';
  if(typeof d.zoom==='number')state.zoom=Math.min(2.4,Math.max(0.8,d.zoom));
  if(typeof d.fontSize==='number')state.fontSize=Math.min(40,Math.max(14,d.fontSize));
  if(typeof d.names==='boolean')state.names=d.names;
  return true;
}
function saveFile(){
  applyLyrics();
  const blob=new Blob([JSON.stringify(toData(),null,1)],{type:'application/json'});
  const a=document.createElement('a');
  const slug=state.title.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  a.href=URL.createObjectURL(blob); a.download=(slug||'lyrics')+'.chords.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#open').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  const text=await f.text(); let d=null;
  try{d=JSON.parse(text);}catch(_){}
  applyLyrics(); commit();
  if(!loadData(d)){state.lines=parseLyrics(text);}
  persist(); syncControls(); $('#title').value=state.title; showView(state.lines.length?'C':'L',true);
});

/* ---------- sheet ---------- */
function renderSheet(){
  const sh=$('#sheet'); sh.innerHTML='';
  sh.style.setProperty('--z',state.zoom); sh.style.fontSize=state.fontSize+'px';
  sh.classList.toggle('hidenames',!state.names);
  $('#songTitle').textContent=state.title; $('#songTitle').hidden=!state.title.trim();
  $('#empty').hidden=state.lines.length>0;
  const frag=document.createDocumentFragment();
  state.lines.forEach((words,l)=>{
    const row=document.createElement('div'); row.className='line';
    const blank=!words.length;
    if(blank)row.classList.add('blank');
    let mn=BASE_MIN,mx=BASE_MAX;
    words.forEach(w=>{if(w.c)w.c.notes.forEach(s=>{const n=parseNote(s);if(n){mn=Math.min(mn,n.idx);mx=Math.max(mx,n.idx);}});});
    const slotH=staveH(mn,mx)*state.zoom+(state.names?14*state.zoom:0);
    const gut=document.createElement('div'); gut.className='gut';
    gut.innerHTML=`<button class="gbtn" data-act="add" data-l="${l}" title="Insert an empty line below" aria-label="Insert an empty line below">+</button>`+
      (words.some(w=>w.t)?'':`<button class="gbtn" data-act="del" data-l="${l}" title="Delete this line" aria-label="Delete this line">\u00d7</button>`);
    row.append(gut);
    words.forEach((w,i)=>{
      const u=document.createElement('div'); u.className='unit'; u.dataset.l=l; u.dataset.w=i;
      const slot=document.createElement('div'); slot.className='slot'; slot.style.height=slotH+'px';
      if(w.c){
        const p=document.createElement('div'); p.className='placed dragsrc';
        p.__chord=w.c; p.__from={l,w:i};
        p.innerHTML=`<div class="cname">${esc(w.c.name||'')}</div>`+renderStave(w.c.notes,{min:mn,max:mx,zoom:state.zoom})+
          '<button class="x" title="Remove chord" aria-label="Remove chord">\u00d7</button>';
        slot.append(p);
      }
      const wd=document.createElement('div'); wd.className='word'; wd.textContent=w.t||'\u00a0';
      u.append(slot,wd); row.append(u);
    });
    // trailing slot: add a chord with no word (line ends, instrumental bars, gaps between verses)
    const tu=document.createElement('div'); tu.className='unit tail'; tu.dataset.l=l; tu.dataset.w=words.length; tu.dataset.tail='1';
    const ts=document.createElement('div'); ts.className='slot'; ts.style.height=blank?'1.7em':slotH+'px';
    ts.innerHTML='<span class="plus">+</span>'; tu.append(ts);
    if(!blank){const wd=document.createElement('div'); wd.className='word'; wd.textContent='\u00a0'; tu.append(wd);}
    row.append(tu);
    frag.append(row);
  });
  sh.append(frag);
}
let suppress=false;
$('#sheet').addEventListener('click',e=>{
  if(suppress)return;
  const g=e.target.closest('.gbtn');
  if(g){const l=+g.dataset.l; mutate(()=>{if(g.dataset.act==='add')state.lines.splice(l+1,0,[]);else state.lines.splice(l,1);}); return;}
  const x=e.target.closest('.x');
  if(x){const f=x.closest('.placed').__from; mutate(()=>clearChord(f.l,f.w)); return;}
  const u=e.target.closest('.unit');
  if(u&&armed)dropOn(+u.dataset.l,+u.dataset.w,armed,null,false,u.dataset.tail==='1');
});
function clearChord(l,w){                       // chord-only tokens disappear with their chord
  const line=state.lines[l],t=line&&line[w]; if(!t)return;
  if(t.t)t.c=null; else line.splice(w,1);
}
function dropOn(l,w,chord,from,copy,tail){
  if(!tail&&from&&from.l===l&&from.w===w)return;
  mutate(()=>{
    const c=cloneChord(chord), target=tail?null:state.lines[l][w];
    if(from&&!copy)clearChord(from.l,from.w);
    if(tail)state.lines[l].push({t:'',c}); else target.c=c;
  });
}

/* ---------- drag and drop (pointer based: mouse, pen and touch) ---------- */
let press=null,drag=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('button,input,select,textarea'))return;
  const el=e.target.closest('.dragsrc'); if(!el||!el.__chord)return;
  press={el,x:e.clientX,y:e.clientY};
});
window.addEventListener('pointermove',e=>{
  if(press&&!drag&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>6)beginDrag(e);
  if(drag){drag.last={x:e.clientX,y:e.clientY};updateDrag();e.preventDefault();}
},{passive:false});
window.addEventListener('pointerup',e=>{
  if(drag){endDrag(e);}
  else if(press&&!press.el.__from){toggleArm(press.el.__chord);}
  press=null;
});
window.addEventListener('pointercancel',()=>{cleanupDrag();press=null;});
function beginDrag(e){
  const el=press.el;
  const g=document.createElement('div'); g.className='ghost';
  g.innerHTML=(el.__chord.name?`<div class="gl">${esc(el.__chord.name)}</div>`:'')+el.querySelector('svg').outerHTML;
  document.body.append(g); document.body.classList.add('dragging');
  if(el.__from)el.classList.add('lifted');
  drag={chord:el.__chord,from:el.__from||null,src:el,ghost:g,over:null,last:{x:e.clientX,y:e.clientY},timer:null};
  drag.timer=setInterval(()=>{
    const top=$('.top').offsetHeight+30+(matchMedia('(max-width:820px)').matches?$('#palette').offsetHeight:0);
    if(drag.last.y<top)window.scrollBy(0,-14); else if(drag.last.y>innerHeight-60)window.scrollBy(0,14);
    updateDrag();
  },16);
  updateDrag();
}
function updateDrag(){
  if(!drag)return;
  const {x,y}=drag.last;
  drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px';
  const t=document.elementFromPoint(x,y), u=t&&t.closest('.unit');
  if(u!==drag.over){drag.over&&drag.over.classList.remove('over'); u&&u.classList.add('over'); drag.over=u;}
  $('#palette').classList.toggle('trash',!!(drag.from&&!u&&t&&t.closest('#palette')));
}
function cleanupDrag(){
  if(!drag)return;
  clearInterval(drag.timer); drag.ghost.remove(); drag.over&&drag.over.classList.remove('over');
  drag.src.classList.remove('lifted'); $('#palette').classList.remove('trash');
  document.body.classList.remove('dragging'); drag=null;
}
function endDrag(e){
  const t=document.elementFromPoint(e.clientX,e.clientY), u=t&&t.closest('.unit');
  const d=drag; cleanupDrag();
  suppress=true; setTimeout(()=>{suppress=false;},60);
  if(u)dropOn(+u.dataset.l,+u.dataset.w,d.chord,d.from,e.altKey||e.ctrlKey,u.dataset.tail==='1');
  else if(d.from&&t&&t.closest('#palette'))mutate(()=>clearChord(d.from.l,d.from.w));
}

/* ---------- "armed" stamping (click a chord, then click words) ---------- */
const DEFAULT_HINT='Drag a chord onto a word, or click a chord and then click words to stamp it. The dashed + at the end of a line (or on an empty line) holds chords with no word; the + / \u00d7 left of a line add or remove empty lines. Drag a placed chord back onto this panel to delete it (Ctrl/Alt-drag copies).';
function toggleArm(c){setArmed(armed&&key(armed)===key(c)?null:c);}
function setArmed(c){
  armed=c?cloneChord(c):null;
  document.body.classList.toggle('armed',!!armed);
  document.querySelectorAll('.pitem').forEach(p=>p.classList.toggle('armed',!!armed&&key(p.__chord)===key(armed)));
  const s=$('#pstatus');
  s.innerHTML=armed?`Stamping <b>${esc(armed.name||'chord')}</b> &mdash; click words to place it. <button class="link" id="stop">Stop</button>`:DEFAULT_HINT;
  const st=$('#stop'); if(st)st.onclick=()=>setArmed(null);
}
window.addEventListener('keydown',e=>{
  if(e.key==='Escape')setArmed(null);
  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&!typing&&view==='C'){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
    else if(k==='y'){e.preventDefault();redo();}
  }
});

/* ---------- palette ---------- */
const TABS=[{id:'common',label:'Common'},...QUALS.map(q=>({id:q.id,label:q.label})),{id:'custom',label:'Custom'}];
function buildTabs(){
  const t=$('#ptabs'); t.innerHTML='';
  TABS.forEach(x=>{
    const b=document.createElement('button'); b.className='chip'+(x.id===tab?' on':''); b.textContent=x.label;
    b.onclick=()=>{tab=x.id;buildTabs();buildPalette();}; t.append(b);
  });
}
function chordsForTab(id){
  if(id==='common')return COMMON.map(parseChordName);
  const q=QUALS.find(x=>x.id===id);
  return q.roots.map(r=>buildChord(r,q));
}
function pitem(chord,opt={}){
  const d=document.createElement('div'); d.className='pitem dragsrc'; d.__chord=chord;
  d.innerHTML=renderStave(chord.notes,{min:26,max:42,zoom:0.9,minW:44})+`<div class="lbl">${esc(chord.name||'\u2014')}</div>`;
  if(opt.removable){
    const b=document.createElement('button'); b.className='x'; b.textContent='×'; b.title='Delete from My chords';
    b.onclick=ev=>{ev.stopPropagation();mutate0(()=>{state.mine=state.mine.filter(c=>c!==chord);});buildMine();};
    d.append(b);
  }
  if(armed&&key(armed)===key(chord))d.classList.add('armed');
  return d;
}
function mutate0(fn){commit();fn();persist();}     // history + save, but no sheet re-render
function buildPalette(){
  const body=$('#pbody'); body.innerHTML='';
  if(tab==='custom'){buildCustom(body);return;}
  const g=document.createElement('div'); g.className='pgrid';
  chordsForTab(tab).forEach(c=>g.append(pitem(c)));
  body.append(g);
}

/* custom chord editor */
let customNotes=[],customName='',toolAcc=0,ghostIdx=null;
const customStrs=()=>[...customNotes].sort((a,b)=>a.idx-b.idx).map(n=>noteStr(n.idx,n.acc));
function buildCustom(body){
  body.innerHTML=`
    <p class="hint">Click a line or space on the stave to add a note. Click a note again to remove it (or to swap its accidental if you pick a different one first).</p>
    <div id="ed" class="editor"></div>
    <div class="seg small" id="accSeg"><button data-a="0">Plain</button><button data-a="1">♯ Sharp</button><button data-a="-1">♭ Flat</button></div>
    <div class="row"><input id="cname" placeholder="Name, e.g. F#m7" maxlength="12"><button id="fill" title="Fill the stave from the chord name">Fill from name</button></div>
    <div class="row"><button id="cclear">Clear</button><button id="csave">Add to My chords</button></div>
    <div class="hint" id="cmsg"></div>
    <div class="plabel">Drag this onto a word</div><div id="cprev"></div>
    <div class="plabel">My chords</div><div class="pgrid" id="mine"></div>`;
  $('#cname').value=customName;
  const ed=$('#ed');
  const idxOf=e=>{
    const r=ed.querySelector('svg').getBoundingClientRect(), H=(42-26)*HALF+2*PAD;
    const vy=(e.clientY-r.top)/r.height*H;
    return Math.max(26,Math.min(42,Math.round(42-(vy-PAD)/HALF)));
  };
  ed.addEventListener('pointermove',e=>{const i=idxOf(e);if(i!==ghostIdx){ghostIdx=i;refreshEditor();}});
  ed.addEventListener('pointerleave',()=>{ghostIdx=null;refreshEditor();});
  ed.addEventListener('click',e=>{
    const idx=idxOf(e), ex=customNotes.find(n=>n.idx===idx);
    if(ex){ if(ex.acc===toolAcc)customNotes=customNotes.filter(n=>n!==ex); else ex.acc=toolAcc; }
    else if(customNotes.length<8)customNotes.push({idx,acc:toolAcc});
    refreshEditor(); refreshPreview();
  });
  $('#accSeg').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{toolAcc=+b.dataset.a;markTool();};
  });
  $('#cname').addEventListener('input',e=>{customName=e.target.value;$('#cmsg').textContent='';refreshPreview();});
  $('#fill').onclick=()=>{
    const c=parseChordName($('#cname').value);
    if(!c){$('#cmsg').textContent='Could not read that name. Try e.g. C, Am, F#m7, Bbmaj7, Gsus4, Bdim.';return;}
    customNotes=c.notes.map(parseNote); customName=$('#cname').value.trim();
    $('#cmsg').textContent=''; refreshEditor(); refreshPreview();
  };
  $('#cclear').onclick=()=>{customNotes=[];refreshEditor();refreshPreview();};
  $('#csave').onclick=()=>{
    const strs=customStrs(); if(!strs.length)return;
    const c={name:customName.trim(),notes:strs};
    if(state.mine.some(m=>key(m)===key(c)&&m.name===c.name))return;
    mutate0(()=>{state.mine.push(c);}); buildMine();
  };
  markTool(); refreshEditor(); refreshPreview(); buildMine();
}
function markTool(){document.querySelectorAll('#accSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.a===toolAcc));}
function refreshEditor(){
  const ed=$('#ed'); if(!ed)return;
  ed.innerHTML=renderStave(customStrs(),{min:26,max:42,zoom:2.2,minW:110,ghost:ghostIdx});
}
function refreshPreview(){
  const box=$('#cprev'); if(!box)return; box.innerHTML='';
  const strs=customStrs();
  if(!strs.length){box.innerHTML='<div class="hint">Nothing yet.</div>';return;}
  const g=document.createElement('div'); g.className='pgrid';
  g.append(pitem({name:customName.trim(),notes:strs})); box.append(g);
}
function buildMine(){
  const g=$('#mine'); if(!g)return; g.innerHTML='';
  if(!state.mine.length){g.innerHTML='<div class="hint" style="grid-column:1/-1">Chords you add appear here and are saved in your file.</div>';return;}
  state.mine.forEach(c=>g.append(pitem(c,{removable:true})));
}

/* ---------- views & controls ---------- */
function setHH(){document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px');}
function showView(v,force){
  if(v==='C'&&view==='L')applyLyrics();
  view=v;
  $('#vL').hidden=v!=='L'; $('#vC').hidden=v!=='C';
  $('#tabL').classList.toggle('on',v==='L'); $('#tabC').classList.toggle('on',v==='C');
  if(v==='L'){$('#lyr').value=serializeText();}
  else{renderSheet();buildTabs();buildPalette();setArmed(armed);}
  setHH(); window.scrollTo(0,0);
}
function refreshAll(){
  $('#title').value=state.title;
  if(view==='L')$('#lyr').value=serializeText(); else{renderSheet();buildPalette();}
}
function syncControls(){
  $('#zoom').value=state.zoom; $('#fsize').value=state.fontSize; $('#names').checked=state.names;
}
$('#tabL').onclick=()=>showView('L');
$('#tabC').onclick=()=>showView('C');
$('#toChords').onclick=()=>showView('C');
$('#undo').onclick=undo; $('#redo').onclick=redo;
$('#save').onclick=saveFile;
$('#print').onclick=()=>{showView('C');setTimeout(()=>window.print(),50);};
$('#title').addEventListener('input',e=>{state.title=e.target.value;persist();if(view==='C')renderSheet();});
$('#zoom').addEventListener('input',e=>{state.zoom=+e.target.value;persist();renderSheet();});
$('#fsize').addEventListener('input',e=>{state.fontSize=+e.target.value;persist();renderSheet();});
$('#names').addEventListener('change',e=>{state.names=e.target.checked;persist();renderSheet();});
$('#lyr').addEventListener('input',()=>{persist();});
window.addEventListener('beforeunload',()=>{try{applyLyrics();localStorage.setItem(KEY,JSON.stringify(toData()));}catch(e){}});
const isDark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function syncTheme(){$('#theme').textContent=isDark()?'\u2600 Light':'\u263e Dark';}
$('#theme').onclick=()=>{
  const t=isDark()?'light':'dark';
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem('stave-chord-theme',t);}catch(e){}
  syncTheme(); setHH();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);
syncTheme();
window.addEventListener('resize',setHH);
if(window.ResizeObserver)new ResizeObserver(setHH).observe($('.top'));

/* ---------- start ---------- */
try{const raw=localStorage.getItem(KEY); if(raw)loadData(JSON.parse(raw));}catch(e){}
$('#title').value=state.title; syncControls(); syncUndo();
showView(state.lines.length?'C':'L');
})();
</script>
</body>
